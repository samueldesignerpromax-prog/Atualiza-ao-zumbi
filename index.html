<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Zombie Survival 2D</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#000;
}

canvas{
    display:block;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const keys = {};

document.addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

// ===== IMAGENS ONLINE =====
const playerImg = new Image();
playerImg.src = "https://i.imgur.com/4LGAZ8t.png";

const zombieImg = new Image();
zombieImg.src = "https://i.imgur.com/s8QZP6F.png";

const bg = new Image();
bg.src = "https://i.imgur.com/3ZQ3ZQK.jpg"; // fundo simples

// ===== PLAYER =====
const player = {
    x: 400,
    y: 300,
    size: 64,
    speed: 5
};

// ===== ZUMBIS =====
const zombies = [];

function spawnZombie(){
    zombies.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 64,
        speed: 1.2
    });
}

setInterval(spawnZombie, 1500);

// ===== MOVIMENTO =====
function movePlayer(){
    if(keys["w"]) player.y -= player.speed;
    if(keys["s"]) player.y += player.speed;
    if(keys["a"]) player.x -= player.speed;
    if(keys["d"]) player.x += player.speed;
}

// ===== ZUMBIS SEGUE JOGADOR =====
function updateZombies(){
    zombies.forEach(z=>{
        const angle = Math.atan2(
            player.y - z.y,
            player.x - z.x
        );

        z.x += Math.cos(angle) * z.speed;
        z.y += Math.sin(angle) * z.speed;
    });
}

// ===== DESENHO =====
function draw(){

    // fundo
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

    // player
    ctx.drawImage(
        playerImg,
        player.x,
        player.y,
        player.size,
        player.size
    );

    // zombies
    zombies.forEach(z=>{
        ctx.drawImage(
            zombieImg,
            z.x,
            z.y,
            z.size,
            z.size
        );
    });
}

// ===== UPDATE =====
function update(){
    movePlayer();
    updateZombies();
}

// ===== LOOP =====
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
